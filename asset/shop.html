<!doctype html>
    <html lang="fr">
    <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google-site-verification" content="CKyIlQ8uhJYfTaSG6yAA259gEPoqFb_AnOEVKZUtzxo" />
    <title>Boutique — 4 produits</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/shop.css" />
    <script type="module" src="./js/shop.js" defer></script>
    <link rel="icon" href="./img/favicon.png" type="image/png">
    </head>
    <body style="background:#0b0d10;color:#e8ecf1;">
        <div class="shop-container">
            <header class="shop-header">
                <div class="shop-brand">
                    <img src="img/shop/logo ipp blanc.webp" alt="" style="width: 140px;height: 100%;">
                </div>
                <nav>
                    <a class="shop-btn secondary" href="auth.html" id="authLink">Se connecter</a>
                    <button class="shop-btn" id="logoutBtn" style="display:none">Se déconnecter</button>
                </nav>
            </header>
            <div class="shop-layout">
                <main>
                    <h1>Nos 4 produits</h1>
                    <div class="shop-grid" id="products"></div>
                </main>
                <aside class="shop-cart">
                    <h3>Mon panier</h3>
                    <div class="shop-alert" id="authGuard">
                        Vous devez être connecté pour payer. <a class="shop-link" href="auth.html">Connexion / Inscription</a>
                    </div>
                    <ul class="shop-list" id="cartList"></ul>
                    <div class="shop-row" style="margin-top:8px">
                        <strong>Total</strong>
                        <strong id="cartTotal">0,00 €</strong>
                        <div class="shop-row" style="align-items:center; gap:1px;">
                            <input id="shippingToggle" type="checkbox" />
                            <label for="shippingToggle">Livraison (+15,00 €)</label>
                        </div>
                    </div>
                    <button class="shop-btn" id="checkoutBtn" style="width:100%; margin-top:12px">Payer avec Stripe</button>
                </aside>
            </div>
        </div>
    </body>
</html>
